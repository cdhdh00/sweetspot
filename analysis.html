<section class="hero compact"><div class="eyebrow">여러 곳을 둘러보고 싶은 날</div><h1>어디에 모여 있을까,<br><em>주변엔 무엇이 있을까?</em></h1><p>매장이 모인 위치를 지도에서 살펴보고, 주변의 다른 선택지를 비교해 보세요.</p></section>
