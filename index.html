<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="공공데이터 OpenAPI로 카페·베이커리 매장을 검색하는 SweetSpot" />
  <title>SweetSpot | 주변 매장 찾기</title>
  <link rel="stylesheet" href="css/style.css?v=fav-style-20261030" />
  <script src="js/config.js?v=simple2-20261029" defer></script>
  <script src="js/common.js?v=favorites-20261030" defer></script>
  <script src="js/search.js?v=remember-region-20261030" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav wrap" aria-label="주요 메뉴">
      <a class="logo" href="index.html"><svg class="logo-icon dessert-icon" aria-hidden="true" viewBox="0 0 32 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 21h18l-3 12H10L7 21Z" fill="#e9ad61" stroke="#386f52" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 21a5 5 0 0 1-1-9 6 6 0 0 1 6-6 6 6 0 0 1 11 4 5.5 5.5 0 0 1 3 11H7Z" fill="#edf4ec" stroke="#386f52" stroke-width="1.8" stroke-linejoin="round"/><path d="m13 24 1 6m5-6-1 6M11 14h2m6 1h2" stroke="#386f52" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="4" r="2.5" fill="#c86651"/></svg> SweetSpot</a>
      <div class="nav-links"><a class="active" href="index.html">매장 찾기</a><a href="analysis.html">지도·주변 탐색</a></div>
    </nav>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">공공데이터로 찾는 우리 동네 한 잔</div>
      <h1>당신의 오늘에 어울리는<br><em>카페 &amp; 베이커리</em></h1>
      <p>전국의 카페와 베이커리를 동네별로 찾아보세요</p>
    </section>
    <section class="panel search-panel" aria-labelledby="search-title">
      <div class="section-heading"><h2 id="search-title">매장 탐색</h2></div>
      <form id="search-form" class="search-form">
        <div class="fields">
          <label for="sido">시·도<select id="sido" name="sido" required disabled><option value="">불러오는 중…</option></select></label>
          <label for="sigungu">시·군·구<select id="sigungu" name="sigungu" required disabled><option value="">시·도를 선택하세요</option></select></label>
          <label for="dong">읍·면·동(행정동)<select id="dong" name="dong" required disabled><option value="">시·군·구를 선택하세요</option></select></label>
        </div>
        <div class="search-actions"><button class="button" id="search-submit" type="submit" disabled>🔎 매장 조회</button><button class="button secondary" type="button" id="region-retry" hidden>지역 목록 다시 불러오기</button></div>
      </form>
    </section>
    <section class="content-section" aria-labelledby="result-title">
      <div class="result-head"><div><h2 id="result-title">검색 결과</h2><p id="result-summary" class="muted">데이터 불러오는 중</p></div>
        <div class="results-controls"><label class="favorites-filter"><input id="favorites-only" type="checkbox" /> 즐겨찾기만 보기</label><label class="visually-label" for="keyword">매장명 검색</label><input id="keyword" type="search" placeholder="매장명 검색" aria-label="매장명 검색" /></div>
      </div>
      <div id="error" class="error" hidden role="alert"></div>
      <div id="results" class="cards" aria-live="polite"></div>
    </section>
  </main>
  
</body>
</html>
